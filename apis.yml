name: Flow AI
description: Flow AI builds infrastructure for embedding schema-aware, deterministic
  AI agents directly inside analytical SaaS products. Its flagship flowai-harness is
  a Rust-native runtime with a Python SDK for building production-grade data agents
  on top of your own data product, organized around five primitives - a data catalog
  agents use to resolve intent, typed plans and actions executed as auditable state
  machines with human approval gates, an embedded runtime, Studio (a local UI to run,
  debug, and evaluate agents), and self-improvement. It runs inside your infrastructure
  with your own model keys (OpenAI, Anthropic, Gemini, Llama, Mistral, Qwen) and warehouse
  (Postgres, Snowflake, BigQuery, Databricks, DuckDB). The team also publishes the
  open Flow Judge LLM-as-a-judge evaluation model and the flow-eval evaluation engine.
