summary: >-
  flowai-harness can expose its runtime tools as Model Context Protocol (MCP)
  servers, so an MCP-aware client (Claude, IDEs, agents) can call the data-agent
  tools defined in a Flow AI runtime. This is a capability of the harness rather
  than a single hosted endpoint operated by Flow AI - each host deploys its own
  server bound to its runtime and tenant.
server:
  name: flowai-harness
