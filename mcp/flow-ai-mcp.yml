  url: null
  docs:
  - https://flow-ai.com/docs/guides/mcp
  - https://flow-ai.com/docs/reference/mcp
notes:
- Runtime tools attached to agents (model-callable capabilities) are surfaced as MCP
  tools; the set of tools is defined per host runtime, not fixed by Flow AI.
- Transports are stdio (local) and Streamable HTTP (remote).
